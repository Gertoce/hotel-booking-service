server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: hotel-service-route
          uri: lb://hotel-management-service
          predicates:
            - Path=/api/hotels/**, /api/rooms/**

        - id: booking-service-route
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**, /api/user/**, /api/booking/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true